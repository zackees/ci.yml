name: soldr
description: Wrapper around zackees/setup-soldr; save-cache passes through a composite input, set by the caller from the precheck plan.
inputs:
  save-cache:
    required: true
runs:
  using: composite
  steps:
    - uses: zackees/setup-soldr@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  # v1.0.0
      with:
        cache-key-suffix: ${{ inputs.cache-key-suffix }}
        solo-toolchain-cache: "false"
        cook-delta: "false"
        save-cache: ${{ inputs.save-cache }}
