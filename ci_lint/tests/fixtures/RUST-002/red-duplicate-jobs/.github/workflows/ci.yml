name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  dylint-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  # v4.1.1
      - run: soldr dylint --all -- --workspace --all-targets
  dylint-macos:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  # v4.1.1
      - run: soldr dylint --all -- --workspace --all-targets --target aarch64-apple-darwin
