name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  dylint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  # v4.1.1
      - uses: zackees/setup-soldr@bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb  # v0.9.82
        with:
          dylint: true
          dylint-toolchain: nightly-2026-05-28
      - run: soldr dylint prepare --target aarch64-apple-darwin
      - run: soldr dylint --all -- --workspace --all-targets --target aarch64-apple-darwin
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  # v4.1.1
      - run: soldr cargo test --locked
