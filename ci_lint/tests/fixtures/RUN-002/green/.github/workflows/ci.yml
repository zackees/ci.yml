name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  precheck:
    uses: ./.github/workflows/ci-pre.yml
  # RUN-002 green: name states the build host, so the Checks tab shows the
  # target never compiles on itself.
  platform-build:
    needs: precheck
    name: platform-build (${{ matrix.lane.id }}) (on ubuntu-24.04, soldr)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        lane: ${{ fromJSON(needs.precheck.outputs.platform_lanes_todo_json) }}
    steps:
      - run: python3 ci/platform_build.py
  # RUN-002 green: name states this leg runs natively.
  platform-run:
    needs: [precheck, platform-build]
    name: platform-run (${{ matrix.lane.id }}) (native, prebuilt)
    runs-on: ${{ matrix.lane.runs_on }}
    timeout-minutes: 10
    strategy:
      matrix:
        lane: ${{ fromJSON(needs.precheck.outputs.platform_lanes_todo_json) }}
    steps:
      - run: python3 ci/platform_run.py
