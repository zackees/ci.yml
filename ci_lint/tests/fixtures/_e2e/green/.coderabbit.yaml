# GATE-012 (zackees/ci.yml#206): CodeRabbit is a GitHub App that cannot run
# under bosn -> act, so it never gates, delays, or second-guesses a PR.
# On-demand `@coderabbitai review` still works as advisory review.
reviews:
  auto_review:
    enabled: false
  commit_status: false
  fail_commit_status: false
  request_changes_workflow: false
chat:
  auto_reply: false
