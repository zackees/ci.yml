name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "crates/demo-platform/**"
      - "ci.toml"
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        os: [linux, windows, macos]
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  # v4.1.1
      - run: soldr cargo test --locked
