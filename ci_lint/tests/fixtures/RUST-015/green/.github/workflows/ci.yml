name: ci
on: [push]
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: soldr cargo nextest run --locked -p running-process --features daemon --lib --test daemon_integration -E '"test(compile_session) | test(/^daemon_env::/)"'
      - run: soldr cargo nextest run --locked --workspace -E '"test(compile_session) | test(/^daemon_env::/)"'
      - run: soldr cargo test --locked --features daemon
      - run: soldr cargo test --locked --features daemon -- --exact some_test
