name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
jobs:
  precheck:
    uses: ./.github/workflows/ci-pre.yml
  # PKG-007 green: soldr wheel --release on an x86_64 runner, catalogue
  # glibc-2.17 sysroot in force (no --host-glibc override), and a step
  # verifying the actual glibc floor against the tag.
  release-linux-x64:
    needs: precheck
    name: release-linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Build release wheel
        id: release-build
        run: python3 ci/release.py build --target x86_64-unknown-linux-gnu --release --out dist/release-linux-x64
      - name: glibc floor check
        run: python3 ci/release.py glibc-check --wheel "$WHEEL_PATH" --max-glibc 2.17
        env:
          WHEEL_PATH: ${{ steps.release-build.outputs.wheel-path }}
