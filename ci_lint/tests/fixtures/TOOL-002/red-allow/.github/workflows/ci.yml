name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  precheck:
    uses: ./.github/workflows/ci-pre.yml
  build:
    needs: precheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  # v4.1.1
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  # v4.1.1
        with:
          repository: zackees/ci.yml
          ref: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          path: ci.yml
      - run: soldr cargo build  # ci-lint: allow RUST-017 wrong rule id does not excuse TOOL-002
      - run: soldr cargo check  # ci-lint: allow TOOL-002
      - run: |
          soldr cargo build  # ci-lint: allow TOOL-002 only this line is excused
          soldr cargo check
