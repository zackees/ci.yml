name: CI
on:
  push:
    branches: [main]
jobs:
  cook:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa  # v4.1.1
      - run: soldr cargo build --locked
      - if: github.ref_name == 'main'
        run: soldr cook save
