# NEEDS REVIEW: the workflow does make a verified-reuse decision, and
# `unit` consumes it correctly, but `clippy` skips default-branch pushes
# with its own blanket `if:` that ignores the decision.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - id: reuse
        if: github.event_name == 'push'
        run: python3 -m ci_lint reuse-check --workflow ci.yml --github-output --required-job "Test linux-x64 (unit)" --required-job "Clippy linux-x64"
  clippy:
    name: Clippy linux-x64
    needs: static
    if: github.ref_name != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: soldr cargo clippy --locked
  unit:
    name: Test linux-x64 (unit)
    needs: static
    if: needs.static.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - run: soldr cargo test --locked
  ci-ok:
    name: CI OK
    if: always()
    needs: [static, clippy, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: python3 ci/ci_ok.py
