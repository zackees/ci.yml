# NEEDS REVIEW: reuse-check is wired, but (1) `integration` is skipped on
# reuse with no --required-job proving it, (2) one --required-job names no
# job of this workflow (a rename), and (3) `lint` reads the output as
# `== 'false'`, which skips it on every pull request (empty output).
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - id: reuse
        if: github.event_name == 'push'
        run: python3 -m ci_lint reuse-check --workflow ci.yml --github-output --required-job "Test linux-x64 (unit) / unit" --required-job "Lint" --required-job "Old job name"
  unit:
    name: Test linux-x64 (unit)
    needs: static
    if: needs.static.outputs.reuse != 'true'
    uses: ./.github/workflows/_run-tests.yml
  integration:
    name: Test linux-x64 (integration)
    needs: static
    if: needs.static.outputs.reuse != 'true'
    uses: ./.github/workflows/_run-tests.yml
  lint:
    name: Lint
    needs: static
    if: needs.static.outputs.reuse == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: python3 -m ci.lint
  ci-ok:
    name: CI OK
    if: always()
    needs: [static, unit, integration, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: python3 ci/ci_ok.py
